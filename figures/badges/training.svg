<svg xmlns="http://www.w3.org/2000/svg" width="150" height="20" viewBox="0 0 150 20" role="img" aria-labelledby="title">
  <title id="title">Training · COCO + MPII</title>
  <defs>
    <clipPath id="corners"><rect width="150" height="20" rx="3"/></clipPath>
    <linearGradient id="shade" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#corners)">
    <rect width="60" height="20" fill="#555"/>
    <rect x="60" width="90" height="20" fill="#ffd21e"/>
    <rect width="150" height="20" fill="url(#shade)"/>
  </g>
  <g text-anchor="middle" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="30" y="15" fill="#010101" fill-opacity=".3" aria-hidden="true">Training</text>
    <text x="30" y="14" fill="#fff">Training</text>
    <text x="105" y="14" fill="#201a08">COCO + MPII</text>
  </g>
</svg>
